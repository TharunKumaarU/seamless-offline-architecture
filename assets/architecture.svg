  <text x="124" y="522" font-size="9.5" fill="#64748B" text-anchor="middle">compress · retry</text>

  <rect x="196" y="488" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="256" y="507" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="middle">Offline auth</text>
  <text x="256" y="522" font-size="9.5" fill="#64748B" text-anchor="middle">cached verifier</text>

  <rect x="64" y="546" width="252" height="52" rx="10" fill="#F8FAFF" stroke="#60A5FA" stroke-dasharray="5 4"/>
