  <text x="850" y="758" font-size="11" font-weight="700" fill="#334155">Sync SLOs (docs/09):</text>
  <text x="850" y="776" font-size="10.5" fill="#475569">outbox depth · drain latency · park rate · 401 rate</text>
  <text x="850" y="794" font-size="10.5" fill="#475569">op_id is the correlation id on both sides of the sync boundary</text>

