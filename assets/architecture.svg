  <text x="510" y="344" font-size="14" font-weight="700" fill="#0F172A">API — FastAPI modular monolith</text>
  <text x="510" y="372" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#94A3B8">DOMAINS</text>
  <text x="572" y="372" font-size="11" fill="#334155">users · tenants · work orders · time entries · reports · master data · notifications</text>
  <text x="510" y="396" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#94A3B8">SHARED</text>
  <text x="572" y="396" font-size="11" fill="#334155">JWT + RBAC · tenancy chokepoint · idempotency · audit · jobs · files/PDF</text>
  <text x="510" y="420" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#94A3B8">SYNC</text>
  <text x="572" y="420" font-size="11" fill="#334155">dedicated /sync surface — push (idempotent) · pull (cursors) (docs/02·03)</text>

