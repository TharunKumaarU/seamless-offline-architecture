  <text x="78" y="157" font-size="13.5" font-weight="700" fill="#0F172A">Mobile App — Flutter</text>
  <text x="78" y="173" font-size="9.5" fill="#64748B">one codebase · iOS &amp; Android</text>

  <rect x="64" y="194" width="252" height="42" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="78" y="212" font-size="12.5" font-weight="600" fill="#0F172A">UI — screens &amp; forms</text>
  <text x="78" y="228" font-size="10.5" fill="#64748B">never awaits the network</text>

  <rect x="64" y="248" width="252" height="42" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="78" y="266" font-size="12.5" font-weight="600" fill="#0F172A">State — Riverpod providers</text>
  <text x="78" y="282" font-size="10.5" fill="#64748B">reads local DB only</text>

